<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200">
  <!-- Lymphix logo — concept B: dual-lineage branching repertoire tree.
       BCR branches (blues, left), TCR branches (reds/oranges, right). -->

  <!-- Trunk -->
  <line x1="80" y1="170" x2="80" y2="130" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
  <!-- Primary fork -->
  <line x1="80" y1="130" x2="50" y2="100" stroke="#1B4F72" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="110" y2="100" stroke="#922B21" stroke-width="5" stroke-linecap="round"/>
  <!-- BCR secondary branches (blue family) -->
  <line x1="50" y1="100" x2="30" y2="70" stroke="#1B4F72" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="100" x2="55" y2="60" stroke="#2E86C1" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="100" x2="20" y2="90" stroke="#85C1E9" stroke-width="4" stroke-linecap="round"/>
  <!-- TCR secondary branches (red/orange family) -->
  <line x1="110" y1="100" x2="105" y2="60" stroke="#922B21" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="100" x2="130" y2="70" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="100" x2="140" y2="90" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  <!-- Clonotype tips -->
  <circle cx="30"  cy="70" r="5" fill="#1B4F72"/>
  <circle cx="55"  cy="60" r="5" fill="#2E86C1"/>
  <circle cx="20"  cy="90" r="5" fill="#85C1E9"/>
  <circle cx="105" cy="60" r="5" fill="#922B21"/>
  <circle cx="130" cy="70" r="5" fill="#C0392B"/>
  <circle cx="140" cy="90" r="5" fill="#E67E22"/>

  <!-- Wordmark -->
  <text x="170" y="115" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="#2C3E50" letter-spacing="-1">Lymphix</text>
  <text x="171" y="142" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#7F8C8D" letter-spacing="2">BCR · TCR · CLONALITY</text>
</svg>
